<style>
:root{--navy:#0a2a5e;--navy2:#123a7a;--lb:#8ec5f0;--lb2:#cfe5f8;--white:#fff;--n1:#f4f6f9;--n2:#e3e8ee;--n3:#8b97a6;--ink:#0d1b2e;--muted:#5b6878;--tableH:30vh;--bar:62px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#eef2f6;font-family:Inter,system-ui,sans-serif;color:var(--ink);font-size:13px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2f7ed8;outline-offset:2px}
#stage{position:fixed;left:0;right:0;top:var(--bar);bottom:var(--tableH)}
#stage canvas{display:block;width:100%;height:100%}
/* summary bar */
#bar{position:fixed;top:0;left:0;right:0;height:var(--bar);background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px;z-index:20;box-shadow:0 2px 12px rgba(10,42,94,.25)}
#bar .wm{font-weight:800;font-size:17px;letter-spacing:.02em;white-space:nowrap}
#bar .wm small{display:block;font-weight:500;font-size:11px;color:var(--lb2);letter-spacing:0}
#bar .kpis{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.kpi{background:rgba(255,255,255,.08);border:1px solid rgba(142,197,240,.25);border-radius:10px;padding:4px 9px;white-space:nowrap;cursor:pointer}
.kpi:hover{background:rgba(255,255,255,.14)}
.kpi span{display:block;font-size:10.5px;color:var(--lb2)}
.kpi b{font-size:15px;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:9.5px;margin-left:5px;padding:1px 5px;border-radius:5px;background:rgba(142,197,240,.25);color:#e6f2fd;vertical-align:2px}
.kpi.na b{font-size:13px;color:var(--lb2)}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:#fff;padding:6px 10px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy)}
.btn{border:1px solid rgba(142,197,240,.4);background:rgba(255,255,255,.08);color:#fff;padding:7px 11px;border-radius:9px;cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.wi[aria-pressed=true]{background:#fff;color:var(--navy)}
/* panels */
.panel{position:fixed;z-index:10;background:rgba(255,255,255,.86);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(10,42,94,.12);box-shadow:0 10px 30px rgba(10,42,94,.14);border-radius:16px}
#nav{left:12px;top:calc(var(--bar) + 12px);bottom:calc(var(--tableH) + 12px);width:292px;padding:14px;overflow:auto}
#detail{right:12px;top:calc(var(--bar) + 12px);bottom:calc(var(--tableH) + 12px);width:392px;overflow:auto;padding:16px 18px}
h4{margin:14px 0 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h4:first-child{margin-top:0}
#search{width:100%;padding:9px 11px;border:1px solid var(--n2);border-radius:10px;background:#fff}
#results{margin-top:6px;max-height:220px;overflow:auto}
.res{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:8px;cursor:pointer}
.res:hover,.res:focus{background:var(--lb2)}
.res small{display:block;color:var(--muted);font-size:11px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.crumbs button{border:0;background:var(--n1);padding:4px 8px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--navy)}
.crumbs button:last-child{background:var(--navy);color:#fff}
.crumbs span{color:var(--n3)}
select{width:100%;padding:7px 9px;border:1px solid var(--n2);border-radius:9px;background:#fff}
label.f{display:block;font-size:11.5px;color:var(--muted);margin:8px 0 4px}
.legend div{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(10,42,94,.2)}
.line{width:22px;height:4px;border-radius:2px;flex:none}
.spaces button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:transparent;padding:6px 8px;border-radius:8px;cursor:pointer;text-align:left}
.spaces button:hover,.spaces button:focus{background:var(--lb2)}
.spaces button[aria-current=true]{background:var(--navy);color:#fff}
.spaces b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.note{font-size:11.5px;color:var(--muted);line-height:1.5}
/* detail */
.kick{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#2f6fb7}
#detail h2{margin:4px 0 6px;font-size:19px;line-height:1.25}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:4px;vertical-align:1px}
.b-src{background:#e3f0fb;color:#0a4a8f;border:1px solid #b9d9f4}
.b-calc{background:#f1f2f4;color:#4b5665;border:1px solid #d9dde3}
.b-hyp{background:#fff3d6;color:#7a5200;border:1px solid #f0d58f}
.amt{font-size:32px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--navy)}
.exact{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.share{margin:6px 0 2px;font-size:12.5px}
.explain{font-size:12.5px;line-height:1.55;margin:10px 0;padding:10px 12px;background:var(--n1);border-radius:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.kv span{color:var(--muted)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.yr{display:grid;grid-template-columns:72px 1fr 92px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.yr .t{height:9px;border-radius:5px;background:var(--n2);overflow:hidden}
.yr .t i{display:block;height:100%;background:var(--navy)}
.yr.bud .t i{background:repeating-linear-gradient(135deg,#2f6fb7 0 5px,#8ec5f0 5px 10px)}
.yr.cur{font-weight:700}
.yr b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.prog{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--n2);margin:6px 0}
.sub{width:100%;border-collapse:collapse;font-size:12px}
.sub td{padding:5px 4px;border-bottom:1px solid var(--n2);vertical-align:top}
.sub td:nth-child(2),.sub td:nth-child(3){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sub tr.link{cursor:pointer}.sub tr.link:hover td{background:var(--lb2)}
.sub .mini{height:4px;background:var(--n2);border-radius:2px;margin-top:4px}.sub .mini i{display:block;height:100%;background:var(--lb);border-radius:2px}
.foot{margin-top:14px;font-size:11px;color:var(--muted);line-height:1.5;border-top:1px solid var(--n2);padding-top:10px}
.hyp-banner{background:#fff3d6;border:1px solid #f0d58f;color:#7a5200;padding:8px 10px;border-radius:10px;font-weight:700;font-size:12px;margin-bottom:10px}
.slider{margin:10px 0}.slider label{display:flex;justify-content:space-between;font-size:12px;font-weight:600}.slider input{width:100%}
code.f{display:block;font-size:11px;background:var(--n1);padding:8px;border-radius:8px;line-height:1.5;white-space:pre-wrap}
/* table */
#table{position:fixed;left:0;right:0;bottom:0;height:var(--tableH);z-index:15;background:#fff;border-top:1px solid var(--n2);display:flex;flex-direction:column}
#tableHead{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--n2);background:var(--n1)}
#tableHead b{font-size:12px}
#tableHead .note{flex:1}
#tblWrap{overflow:auto;flex:1}
table.data{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.data th{position:sticky;top:0;background:#fff;z-index:1;text-align:right;padding:6px 8px;border-bottom:2px solid var(--n2);font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data td{padding:5px 8px;border-bottom:1px solid var(--n1);text-align:right;white-space:nowrap}
table.data td:first-child{white-space:normal;min-width:220px}
table.data .cm{background:#eaf4fd}
table.data th.cm{background:#d7ebfb;color:var(--navy)}
table.data tr.row{cursor:pointer}
table.data tr.row:hover td{background:#f3f8fd}
table.data tr.sel td{background:#d7ebfb!important;font-weight:600}
table.data tr.tot td{font-weight:700;background:var(--n1)}
table.data tr.calc td{color:var(--muted)}
.neg{color:#6a3b00}
#tip{position:fixed;pointer-events:none;z-index:30;background:var(--navy);color:#fff;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.4;opacity:0;transition:opacity .12s;max-width:300px;box-shadow:0 6px 18px rgba(10,42,94,.3)}
#tip span{color:var(--lb2)}
#fallback{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:30px;color:var(--muted)}
body.no3d #fallback{display:grid}
#viewNote{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--bar) + 12px);z-index:9;background:rgba(10,42,94,.9);color:#fff;padding:7px 14px;border-radius:999px;font-size:12px;white-space:nowrap;max-width:calc(100vw - 740px);overflow:hidden;text-overflow:ellipsis}
.collapse{display:none}
@media (max-width:1100px){
  #nav{width:250px}#detail{width:330px}#viewNote{display:none}
}
@media (max-width:820px){
  :root{--bar:auto;--tableH:0px}
  #bar{position:relative;height:auto;flex-wrap:wrap;padding:8px}
  #stage{position:relative;top:0;height:56vh}
  #nav,#detail,#table{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:auto;height:auto;margin:10px;border-radius:14px}
  html,body{overflow:auto}
  #tblWrap{max-height:60vh}
  #table{height:auto}
}
</style>

function shareTxt(n){const p=parentOf(n);if(!p||n.t==='gate')return null;let pv,pl;
  if(n.t==='revcat'||n.t==='revarea'){pv=revTotal(S.m);pl='of revenue & credits recorded in the report'}
  else if(n.t==='path'||n.t==='area'){pv=val({t:'root'});pl='of the report total'}else{pv=val(p);pl='of '+nameOf(p)}

function explain(n){
  if(n.t==='root')return`The report total: the Grand Total row on page ${D.grand.p}, which rolls up the ${D.areas.length} Responsible Area totals. The report does not say whether it covers every fund or the complete university budget.`;

  if(n.t==='path')return`Roll-up path. The report adds each Responsible Area's total into the Grand Total. This path shows that documented relationship. It does not show a flow of funds from a source.`;
  if(n.t==='dv')return`A division within ${esc(AR(n.i).n)}, as labeled in the report's Division column. The report prints <b>no division subtotal</b>, so this amount is the calculated sum of its ${DV(n.i,n.d).ccs.length} cost-center totals.`;
  if(n.t==='cc'){const c=CC(n.i,n.d,n.j);return c.cc==='Inactive'?`Cost centers the report groups as “Inactive” within ${esc(AR(n.i).n)} (division: ${esc(DV(n.i,n.d).n)}). Its total rolls up ${c.o.length} line items.`:`Cost center ${c.cc} in ${esc(AR(n.i).n)} (division: ${esc(DV(n.i,n.d).n)}). Its total rolls up ${c.o.length} line item${c.o.length>1?'s':''} (object codes).`}
  if(n.t==='obj'){const o=OB(n.i,n.d,n.j,n.k);return`Line item: object code ${o[0]} “${esc(o[1])}” in cost center ${esc(CC(n.i,n.d,n.j).n)}. ${SCN[sk(o[0])].d}`}
  if(n.t==='gate')return`Revenue and credit lines (object codes 4xxxx) that the report books inside cost centers. <b>This is not presented as the university's complete revenue.</b> State appropriations, for example, do not appear. The PDF prints these lines as negatives. Here they are shown as positive amounts of revenue recorded.`;

      for(let k=0;k<cnt;k++){const n=items[idx++];const aa=k/cnt*Math.PI*2+ring*.2;const m=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.6,1.2,6),mat(n.t==='dv'?0x2f6fb7:(col?0x2d5a9e:0x6aa9e6),{emissive:0x000000}));
        m.position.set(Math.cos(aa)*r,Y+ring*1.2,Math.sin(aa)*r);m.castShadow=true;g.add(m);m.userData.node=n;clickables.push(m);meshes.push(m)}ring++}
    const disc=new THREE.Mesh(new THREE.CylinderGeometry(13+ring*7,13+ring*7,.2,64),new THREE.MeshBasicMaterial({color:0xcfe5f8,transparent:true,opacity:.35,depthWrite:false}));disc.position.y=Y-.8;g.add(disc);const rim=new THREE.Mesh(new THREE.TorusGeometry(13+ring*7,.25,6,96),new THREE.MeshBasicMaterial({color:0x2f6fb7}));rim.rotation.x=Math.PI/2;rim.position.y=Y-.7;g.add(rim);
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,Y-10,8).translate(0,(Y-10)/2+9,0),mat(0x9fb3c8));g.add(stem);
    const cap=label([{t:b.t==='dv'?`${DV(b.i,b.d).n}`:AR(b.i).s,s:40},{t:items[0]?.t==='dv'?`${items.length} divisions`:`${items.length} cost-center groups`,s:30,w:500,c:'#5b6878'}],{sw:24,h:170});cap.position.set(0,Y+ring*1.2+9,0);g.add(cap);
    fan={g,key,items:meshes,b}}

  /* allocation treemap */
  let tiles=null;
  function squarify(items,x,y,w,h){const out=[];const total=items.reduce((s,a)=>s+a.v,0);if(total<=0)return out;const scale=w*h/total;let rest=items.map(a=>({...a,area:a.v*scale}));let rx=x,ry=y,rw=w,rh=h;
    const worst=(row,side)=>{const s=row.reduce((a,b)=>a+b.area,0);const mx=Math.max(...row.map(r=>r.area)),mn=Math.min(...row.map(r=>r.area));return Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn))};
    while(rest.length){const side=Math.min(rw,rh);let row=[rest[0]];let k=1;while(k<rest.length&&worst([...row,rest[k]],side)<=worst(row,side)){row.push(rest[k]);k++}
      const s=row.reduce((a,b)=>a+b.area,0);if(rw>=rh){const cw=s/rh;let cy=ry;row.forEach(r=>{const ch=r.area/cw;out.push({...r,x:rx,y:cy,w:cw,h:ch});cy+=ch});rx+=cw;rw-=cw}
      else{const ch=s/rw;let cx=rx;row.forEach(r=>{const cw=r.area/ch;out.push({...r,x:cx,y:ry,w:cw,h:ch});cx+=cw});ry+=ch;rh-=ch}rest=rest.slice(k)}return out}
  function tileLabel(w,h,lines,dark){const cv=document.createElement('canvas');cv.width=512;cv.height=Math.max(96,Math.min(512,Math.round(512/(w/h))));const g=cv.getContext('2d');
    g.fillStyle=dark?'#ffffff':'#0a2a5e';g.textAlign='left';g.textBaseline='top';let y=14;const fs=Math.min(44,cv.height/4.2);
    lines.forEach((l,x)=>{g.font=`${x===0?700:600} ${x===0?fs:fs*.82}px Inter, sans-serif`;let t=l;while(g.measureText(t).width>480&&t.length>4)t=t.slice(0,-2);if(t!==l)t=t.slice(0,-1)+'…';g.fillText(t,16,y);y+=fs*1.15});
    const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;return new THREE.Mesh(new THREE.PlaneGeometry(w*.96,h*.96).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:tex,transparent:true}))}
  function buildTiles(){if(tiles){unreg(tiles);tiles.traverse(o=>{if(o.material&&o.material.map)o.material.map.dispose()});scene.remove(tiles);tiles=null}if(S.view!=='alloc')return;
    const b=levelNode(S.node.t==='path'?{t:'root'}:S.node);const scope=b.t==='gate'?'rev':S.scope;const sign=b.t==='gate'?-1:1;
    const all=children(b);const items=all.map(n=>({n,v:sign*val(n,scope)})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
    const W=205,H=135;const rects=squarify(items,-W/2,-H/2,W,H);const total=items.reduce((s,r)=>s+r.v,0);tiles=new THREE.Group();scene.add(tiles);
    rects.forEach((r,x)=>{const n=r.n;let color=LB,dark=false;
      if(n.t==='area'){color=AR(n.i).col?NAVY:LB;dark=AR(n.i).col}else if(n.t==='dv'||n.t==='cc'){const c=AR(n.i).col;color=c?(x%2?0x123a7a:0x0a2a5e):(x%2?0xa7d1f4:0x8ec5f0);dark=c}
      else if(n.t==='obj'){const k=sk(OB(n.i,n.d,n.j,n.k)[0]);color={pers:0x0a2a5e,ops:0x8ec5f0,aid:0xdcecf9,oth:0xb4bec9,rev:0x8b97a6}[k];dark=k==='pers'}else if(n.t==='revcat'){color=x%2?0x8ec5f0:0x0a2a5e;dark=!(x%2)}
      const w=Math.max(.1,r.w-.6),h=Math.max(.1,r.h-.6);const m=new THREE.Mesh(new THREE.BoxGeometry(w,1,h).translate(0,.5,0),mat(color,{roughness:.5,emissive:0x000000}));
      m.position.set(r.x+r.w/2,0,r.y+r.h/2);m.castShadow=m.receiveShadow=true;m.userData.node=n;clickables.push(m);tiles.add(m);
      if(w>16&&h>7){const L=tileLabel(w,h,[nameOf(n),`${$(r.v)} · ${(r.v/total*100).toFixed(1)}%`],dark);L.position.set(m.position.x,1.05,m.position.z);tiles.add(L)}});
    const omitted=all.length-items.length;
    {const cv=document.createElement('canvas');cv.width=2048;cv.height=128;const g=cv.getContext('2d');g.fillStyle='#0a2a5e';g.font='700 52px Inter, sans-serif';g.fillText(`Area ∝ ${b.t==='gate'?'revenue & credits recorded':SCN[scope].l} · ${MEAS[S.m].l}`+(omitted?` · ${omitted} zero/negative item(s) not drawn`:''),10,80);
     const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;const cap=new THREE.Mesh(new THREE.PlaneGeometry(205,6.4).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:t,transparent:true}));cap.position.set(0,.1,H/2+6);tiles.add(cap)}}

  /* update from state */
  let selMesh=null;
  function refreshLabels(){const rootV=val({t:'root'});
    hubLabel.userData.draw([{t:'University Budget Hub',s:36},{t:$(rootV),s:58,w:800},{t:`${SCN[S.scope].l.split(' (')[0]} · ${MEAS[S.m].l}`,s:26,w:500,c:'#5b6878'}]);
    pav.forEach(p=>{const v=val({t:'area',i:p.a.i});const sh=rootV&&Math.sign(v)===Math.sign(rootV)?(v/rootV*100).toFixed(1)+'% of total':'n/a (opposite sign)';p.L.userData.draw([{t:p.a.s,s:40},{t:$(v),s:54,w:800},{t:sh,s:28,w:500,c:'#5b6878'}])});
    gateLabel.userData.draw([{t:'Revenue & Credits Gateway',s:34},{t:$(-revTotal(S.m)),s:54,w:800},{t:'recorded in this report only',s:26,w:500,c:'#5b6878'}])}
  function update({focus}={}){const n=S.node;const explore=S.view==='explore';
    [hub,hubLabel,gate,gateLabel,...stones,...stones.map(s=>s.userData.lbl)].forEach(o=>o.visible=explore);
    pav.forEach(p=>{const ig=inGroup(p.a);p.g.visible=p.path.visible=p.pulse.visible=explore;p.L.visible=explore&&!(fanBase(S.node)&&fanBase(S.node).i===p.a.i);
      p.g.children.forEach((m,ci)=>{m.material.transparent=true;m.material.opacity=(ci===3?.6:1)*(ig?1:.25)});p.L.material.opacity=ig?1:.35;p.path.material.opacity=ig?1:.3});
    const ai=['area','dv','cc','obj'].includes(n.t)?n.i:null;
    revPaths.forEach((t,i)=>{t.visible=explore&&ai==null&&AR(i).agg.rev[S.m]!==0&&inGroup(AR(i))});
    buildFan(explore?fanBase(n):null);refreshLabels();buildTiles();
    if(selMesh){selMesh.material.emissive&&selMesh.material.emissive.setHex(0);selMesh=null}
    if(explore){if(['area','path','revarea'].includes(n.t))selMesh=pav[n.i].body;else if(fan){const tgt=n.t==='obj'?{t:'cc',i:n.i,d:n.d,j:n.j}:n;fan.items.forEach(m=>{if(same(m.userData.node,tgt))selMesh=m});if(!selMesh)selMesh=pav[n.i].body}}
    else if(tiles)tiles.children.forEach(m=>{if(m.userData.node&&same(m.userData.node,n))selMesh=m});
    if(selMesh)selMesh.material.emissive.setHex(0x3a6fb0);
    if(focus)focusOn(n)}
  let fly=null;const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  function focusOn(n){if(S.view==='alloc'){fly={t:V(0,0,4),c:V(0,215,105)};return}
    if(n.t==='root')fly={t:HOME.t.clone(),c:HOME.c.clone()};
    else if(n.t==='gate'||n.t==='revcat')fly={t:V(0,8,GZ),c:V(0,80,GZ+100)};
    else if(n.i!=null){const p=pav[n.i];const drilled=['area','dv','cc','obj'].includes(n.t);const ty=drilled?22:6;const d=drilled?85:70;
      fly={t:V(p.x,ty,p.z),c:V(p.x+Math.cos(p.ang)*d*.9+Math.cos(p.ang+1.3)*14,ty+d*.75,p.z+Math.sin(p.ang)*d*.9+Math.sin(p.ang+1.3)*14)}}}
  function reset(){update({focus:true})}
  controls.addEventListener('start',()=>{fly=null});

  /* interaction */
  const ray=new THREE.Raycaster(),ptr=new THREE.Vector2(-9,-9);let dirty=false,pc={x:0,y:0},down=null;const tip=document.getElementById('tip');
  const visible=o=>{while(o){if(!o.visible)return false;o=o.parent}return true};
  function pick(){ray.setFromCamera(ptr,camera);for(const h of ray.intersectObjects(clickables,false))if(visible(h.object))return h.object;return null}
  const toNDC=e=>{const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1)};
  renderer.domElement.addEventListener('pointermove',e=>{toNDC(e);pc={x:e.clientX,y:e.clientY};dirty=true});
  renderer.domElement.addEventListener('pointerleave',()=>{ptr.set(-9,-9);dirty=true});
  renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}});
  renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(mv>6)return;toNDC(e);const o=pick();if(o)go(o.userData.node)});
  function tipFor(n){const isR=['gate','revcat','revarea'].includes(n.t);const v=isR?-val(n):val(n);const sh=shareTxt(n);
    const nm=n.t==='path'?`Roll-up path: ${AR(n.i).s} → report total`:nameOf(n);return `<b>${esc(nm)}</b><br>${$(v)} <span>· ${MEAS[S.m].l}</span>${sh&&sh.p!=null?`<br><span>${sh.txt}</span>`:n.t==='root'?'<br><span>100% of report total</span>':''}`}
  function hover(){if(!dirty)return;dirty=false;const o=pick();
    if(o){tip.innerHTML=tipFor(o.userData.node);tip.style.opacity=1;tip.style.left=Math.min(pc.x+14,innerWidth-310)+'px';tip.style.top=(pc.y+14)+'px';renderer.domElement.style.cursor='pointer'}else{tip.style.opacity=0;renderer.domElement.style.cursor='default'}}
  renderer.domElement.addEventListener('keydown',e=>{const off=camera.position.clone().sub(controls.target);const sph=new THREE.Spherical().setFromVector3(off);let used=true;
    if(e.key==='ArrowLeft')sph.theta-=.12;else if(e.key==='ArrowRight')sph.theta+=.12;else if(e.key==='ArrowUp')sph.phi=Math.max(.15,sph.phi-.08);else if(e.key==='ArrowDown')sph.phi=Math.min(Math.PI*.47,sph.phi+.08);
    else if(e.key==='+'||e.key==='=')sph.radius=Math.max(25,sph.radius*.88);else if(e.key==='-'||e.key==='_')sph.radius=Math.min(650,sph.radius*1.12);else used=false;
    if(used){e.preventDefault();fly=null;camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph))}});

  /* loop (restrained animation) */
  const clock=new THREE.Clock();let T=0;
  function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);T+=dt;
    pav.forEach(p=>{const t=(T*.15+p.ph)%1;p.pulse.position.x=p.ex+(p.sx-p.ex)*t;p.pulse.position.z=p.ez+(p.sz-p.ez)*t;p.pulse.material.opacity=.75*Math.sin(Math.PI*t)*(inGroup(p.a)?1:.3)});
    hub.userData.band.material.emissiveIntensity=.4+.15*Math.sin(T*1.5);
    if(fan)fan.g.children.forEach(m=>{if(m.userData.node)m.rotation.y+=dt*.2});
    if(selMesh&&selMesh.material.emissive)selMesh.material.emissiveIntensity=.55+.35*Math.sin(T*3);
    if(fly){const k=1-Math.exp(-dt*2.8);controls.target.lerp(fly.t,k);camera.position.lerp(fly.c,k);if(camera.position.distanceTo(fly.c)<.5)fly=null}
    controls.update();hover();renderer.render(scene,camera)}
  update({focus:true});loop();
  if(document.fonts)document.fonts.ready.then(()=>{refreshLabels();stones.forEach((s,x)=>s.userData.lbl.userData.draw([{t:REVSHORT[revKeys[x]],s:58}],{}))});
  return{update,reset,resize}}
init3D().then(w=>{world=w}).catch(e=>{console.warn('3D unavailable:',e);document.body.classList.add('no3d')});
